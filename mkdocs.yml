site_name: Holostaff AI Documentation
site_url: https://docs.holostaff.ai
site_description: Documentation for Holostaff AI. In-product customer success on autopilot. AI staff learn your product from your code, spot users the moment they struggle, and step in right in the session. Shipped with one PR.
site_author: Holostaff AI Team
use_directory_urls: false

# Repository link (public CLI repo)
repo_url: https://github.com/Holostaff-AI/holostaff-cli
repo_name: GitHub

# Theme configuration
theme:
  name: material
  # custom_dir: docs/theme_overrides # Optional: for future custom CSS/JS
  palette:
    # Light mode palette (default)
    - scheme: default
      primary: blue        # Closest Material Design color to #284281
      accent: pink
      toggle:
        icon: material/brightness-4 # Icon for light mode
        name: Switch to dark mode
    # Dark mode palette
    - scheme: slate
      primary: blue        # Closest Material Design color to #284281
      accent: pink
      toggle:
        icon: material/brightness-2 # Icon for dark mode
        name: Switch to light mode
  font:
    text: Inter            # App uses Inter font
    code: Roboto Mono
  features:
    - navigation.tabs           # Top-level navigation as tabs
    - navigation.tabs.sticky    # Tabs stick to the top when scrolling
    - navigation.footer         # Footer navigation links
    - navigation.sections       # Sections/sub-sections in the side nav
    - navigation.expand         # Automatically expands sub-sections
    - toc.integrate             # Integrate table of contents with side navigation
    - search.suggest            # Search suggestions as you type
    - search.highlight          # Highlight search results on the page
    - content.code.copy         # Copy button for code blocks
    - content.code.annotate     # Code block annotations
  favicon: assets/images/favicon.ico
  logo: assets/logo.png


# Plugins
plugins:
  - search
  - redirects:
      redirect_maps:
        ai-staff/index.md: copilots/index.md
        analytics/index.md: impact/index.md
        knowledge/index.md: journey-maps/index.md

# Markdown extensions
markdown_extensions:
  - admonition                      # For note, tip, warning blocks
  - pymdownx.highlight:             # Better code highlighting
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite           # Inline highlighting
  - pymdownx.snippets               # For including snippets from other files
  - pymdownx.superfences            # Nested code blocks
  - pymdownx.details                # Expandable sections
  - attr_list                       # For adding attributes to markdown elements
  - md_in_html                      # Allows Markdown inside HTML blocks
  - footnotes                       # Footnotes

# Point to custom CSS for color definitions
extra_css:
  - stylesheets/extra.css

# Navigation structure
nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
      - Your Account: getting-started/creating-account.md
      - The Dashboard: getting-started/dashboard.md
  - Journey Maps:
      - What is a Journey Map: journey-maps/index.md
      - The Canvas: journey-maps/canvas.md
  - Copilots:
      - Your AI Staff: copilots/index.md
      - Creating a Copilot: copilots/create.md
  - How It Works:
      - Guarded Actions: how-it-works/guarded-actions.md
      - Rehearsal Evaluations: how-it-works/rehearsal-evaluations.md
      - Deploying via Pull Request: how-it-works/deploying-via-pull-request.md
      - What Leaves Your Machine: how-it-works/what-leaves-your-machine.md
  - Evaluations:
      - Rehearsing with Simulated Users: evaluations/index.md
  - Deploying:
      - The Deploy Flow: deploy/index.md
      - The SDK: deploy/sdk.md
  - Impact:
      - Measuring What Changed: impact/index.md
  - CLI Reference:
      - Commands & CI: cli/index.md
  - Workspaces:
      - Workspaces & Collaboration: workspaces/index.md
      - Team Management: workspaces/team-management.md
  - Billing:
      - Billing & Subscriptions: billing/index.md
  - Support:
      - Knowledge Base & FAQs: support/index.md
      - Data Deletion Policy: support/data-deletion.md
      - Privacy Policy: support/privacy-policy.md
      - Terms of Service: support/terms-of-service.md
